# Builds the installer on a clean Windows machine with scripts\build-installer.ps1.
# The result is uploaded as a workflow artifact; publishing a release stays a
# separate, deliberate step.
name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Fetch dependencies
        shell: pwsh
        run: .\scripts\fetch-deps.ps1
      - name: Build
        shell: pwsh
        run: .\scripts\build-installer.ps1
      - name: Bluetooth beacon script (dry run, Windows PowerShell 5.1)
        shell: pwsh
        run: |
          $out = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File installer\airdrop-beacon.ps1 -DryRun
          "$out"
          if ("$out" -notmatch '^would advertise \d+ bytes$') { throw "beacon dry run: $out" }
      - name: SHA-256
        shell: pwsh
        run: Get-ChildItem build\AetherDrop-*-setup.exe | Get-FileHash -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: build/AetherDrop-*-setup.exe
          if-no-files-found: error
